<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" width="800" height="160">
  <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff50" stroke-width="0.4" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" fill="#000"/>
  <rect width="800" height="160" fill="url(#grid)"/>
  <rect width="800" height="160" fill="url(#vig)"/>

  <!-- Scanlines -->
  <rect width="800" height="160" fill="none"
    style="background: repeating-linear-gradient(transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px)"/>

  <!-- Corner brackets -->
  <polyline points="14,6 6,6 6,22" fill="none" stroke="#00ff50" stroke-width="1.5" stroke-opacity="0.5"/>
  <polyline points="786,6 794,6 794,22" fill="none" stroke="#00ff50" stroke-width="1.5" stroke-opacity="0.5"/>
  <polyline points="14,154 6,154 6,138" fill="none" stroke="#00ff50" stroke-width="1.5" stroke-opacity="0.5"/>
  <polyline points="786,154 794,154 794,138" fill="none" stroke="#00ff50" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Left deco text -->
  <text x="20" y="50" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.25">root@kali:~$ nmap -sV</text>
  <text x="20" y="65" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2">22/tcp  open  ssh</text>
  <text x="20" y="80" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2">443/tcp open  https</text>
  <text x="20" y="95" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.25">[+] Shell obtained!</text>
  <text x="20" y="110" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2">0xDEADBEEF</text>
  <text x="20" y="125" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2">chmod 777 /pwned</text>

  <!-- Right deco text -->
  <text x="780" y="50" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.25" text-anchor="end">AES-256-GCM ✓</text>
  <text x="780" y="65" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2" text-anchor="end">ChaCha20-Poly1305 ✓</text>
  <text x="780" y="80" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2" text-anchor="end">CVE-2024-XXXX CRIT</text>
  <text x="780" y="95" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.25" text-anchor="end">TCP SYN → ACK</text>
  <text x="780" y="110" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2" text-anchor="end">ZKP · Post-Quantum</text>
  <text x="780" y="125" font-family="monospace" font-size="9" fill="#00ff50" fill-opacity="0.2" text-anchor="end">[SESSION ACTIVE]</text>

  <!-- Horizontal divider lines -->
  <line x1="220" y1="58" x2="580" y2="58" stroke="#00ff50" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="220" y1="118" x2="580" y2="118" stroke="#00ff50" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- Prompt line -->
  <text x="400" y="75" font-family="monospace" font-size="11" fill="#00ff50" fill-opacity="0.6" text-anchor="middle">root@kali:~$ ./launch --channel</text>

  <!-- Channel name: tek text, tspan ile renk ayrımı -->
  <text x="400" y="108" font-family="monospace" font-size="38" font-weight="bold" text-anchor="middle" letter-spacing="2">
    <tspan fill="#00ff50">c411</tspan><tspan fill="#ffffff">ister</tspan><tspan fill="#00ff50">&#x2588;</tspan>
  </text>

  <!-- Blinking cursor (block character üzerinde) -->
  <text x="400" y="108" font-family="monospace" font-size="38" font-weight="bold" text-anchor="middle" letter-spacing="2">
    <tspan fill="transparent">c411ister</tspan><tspan fill="#000000">&#x2588;<animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/></tspan>
  </text>

  <!-- Tagline -->
  <text x="400" y="138" font-family="monospace" font-size="9.5" fill="#00ff50" fill-opacity="0.55" text-anchor="middle" letter-spacing="3">SIBER GUVENLIK · KRIPTOGRAFI · ETIKAL HACKING</text>
</svg>
